[workspace]
members = [".", "driver", "codegen_tests/output/rust", "pyxis_macros", "tooling/lsp"]
default-members = [".", "driver", "tooling/lsp"]

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"

[workspace.dependencies]
specta = { git = "https://github.com/specta-rs/specta.git", rev = "effe988832312009388a11487ad0ceb09b934a80", features = [
    "derive",
    "export",
] }
specta-typescript = { git = "https://github.com/specta-rs/specta.git", rev = "effe988832312009388a11487ad0ceb09b934a80" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lsp-server = "0.8"
lsp-types = "0.97"
crossbeam-channel = "0.5"
url = "2.5"
expect-test = "1.4"
proptest = "1.11"
test-case = "3.3"

[package]
name = "pyxis"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
glob = { version = "0.3.0" }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "2.0", features = ["full", "extra-traits"] }
prettyplease = "0.2"
toml = "0.9.8"
serde = { workspace = true }
ariadne = "0.6.0"
pyxis_macros = { path = "pyxis_macros" }
salsa = "0.27"

# driver-only
serde_json = { workspace = true, optional = true }
specta = { workspace = true, optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false }

[features]
json = ["dep:serde_json", "dep:specta"]
cpp = []

[[example]]
name = "codegen_tests"
required-features = ["json", "cpp"]

[dev-dependencies]
pretty_assertions = "1.4"
proptest = { workspace = true }
test-case = { workspace = true }
